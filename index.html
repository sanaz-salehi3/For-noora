<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Noora ♡</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600&display=swap');

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:#0d0a12;
    color:#fff;
    font-family:'Vazirmatn',sans-serif;
    overflow-x:hidden;
}

/* ستاره ها */

.stars{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
}

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    opacity:.5;
    animation:twinkle 3s infinite ease-in-out;
}

@keyframes twinkle{
    0%,100%{opacity:.15;transform:scale(.7)}
    50%{opacity:.9;transform:scale(1.3)}
}

/* صفحه اول */

#opening{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    z-index:1;
    padding:30px;
}

.hero{
    text-align:center;
    animation:appear 1.5s ease;
}

@keyframes appear{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.mini{
    font-size:11px;
    letter-spacing:6px;
    color:#d9b8ca;
    direction:ltr;
}

.noora{
    font-family:Georgia,serif;
    font-weight:400;
    font-size:clamp(75px,20vw,150px);
    line-height:.8;
    margin:35px 0;
    direction:ltr;
    background:linear-gradient(
        90deg,
        #fff,
        #eac5d8,
        #fff
    );
    -webkit-background-clip:text;
    color:transparent;
}

.birth{
    font-size:13px;
    letter-spacing:5px;
    color:#bfaab7;
    direction:ltr;
}

.open{
    margin-top:45px;
    padding:16px 35px;
    border-radius:50px;
    border:1px solid #d8b6c9;
    background:#ffffff0d;
    color:white;
    font-family:inherit;
    font-size:14px;
    cursor:pointer;
    backdrop-filter:blur(10px);
    transition:.4s;
}

.open:hover{
    background:#fff;
    color:#1a1119;
    transform:translateY(-4px);
    box-shadow:0 10px 35px #d6a9c455;
}

/* محتوای اصلی */

#content{
    display:none;
    position:relative;
    z-index:1;
}

.container{
    width:min(850px,92%);
    margin:auto;
    padding:100px 0;
}

.section{
    text-align:center;
    margin-bottom:120px;
    animation:fadeUp 1s ease;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(35px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.label{
    color:#d9b8ca;
    font-size:11px;
    letter-spacing:5px;
    direction:ltr;
}

.title{
    font-family:Georgia,serif;
    font-size:clamp(32px,7vw,52px);
    font-weight:400;
    margin:20px 0;
}

.text{
    color:#c8bac3;
    line-height:2.2;
    font-size:15px;
}

/* کارت */

.card{
    margin-top:30px;
    padding:35px;
    border-radius:30px;
    background:linear-gradient(
        145deg,
        #ffffff0d,
        #ffffff03
    );
    border:1px solid #ffffff18;
    box-shadow:0 20px 60px #00000035;
    backdrop-filter:blur(15px);
}

/* نامه */

.letter{
    text-align:right;
    line-height:2.4;
    color:#e5dbe1;
    font-size:15px;
}

/* آرزوها */

.wishes{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.wish{
    padding:18px;
    border-radius:18px;
    background:#ffffff08;
    border:1px solid #ffffff10;
    color:#d7cbd2;
    transition:.3s;
}

.wish:hover{
    transform:translateY(-4px);
    background:#ffffff12;
}

/* تایم کپسول */

.capsule{
    padding:45px 25px;
}

.year{

    font-size:55px;
    direction:ltr;
    color:#e7bfd2;
    margin-bottom
